[workspace]
resolver = "2"
members = ["packages/backend/bounty-backend",
    "packages/program/bounty-board/programs/bounty-board"
]

[workspace.dependencies]
anchor-lang   = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl    = { version = "0.32.1", features = ["token", "associated_token"] }
spl-associated-token-account = { version = "6.0.0", features = ["no-entrypoint"] }

tokio         = { version = "1", features = ["full"] }
axum          = { version = "0.7", features = ["macros"] }

# ── Database ──────────────────────────────────────────────
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "macros"] }

# ── Serde ─────────────────────────────────────────────────
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

solana-sdk    = { version = "2.1.0" }
solana-client = { version = "2.1.0" }
spl-token = {version = "4", features = ["no-entrypoint"]}
anchor-client   = "0.32.1"
hmac            = "0.12"

ed25519-dalek = { version = "2" }
jsonwebtoken  = { version = "9" }
reqwest = { version = "0.12", features = ["json"] }
resend-rs = "0.5" 




uuid      = { version = "1", features = ["v4", "serde"] }
chrono    = { version = "0.4", features = ["serde"] }
anyhow    = { version = "1" }
thiserror = { version = "2" }
dotenvy   = { version = "0.15" }
utoipa    = { version = "4", features = ["axum_extras"] }
rand = { version = "0.8" }
bs58 = { version = "0.5" }
hex = { version = "0.4" }
sha2 = { version = "0.10" }


# ── Tracing ───────────────────────────────────────────────
tracing            = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.5", features = ["cors"] }


pyth-solana-receiver-sdk = "1.1.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

